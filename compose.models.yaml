services:
  ollama:
    image: ollama/ollama:0.40.12
    volumes:
      - desk-models:/root/.ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NO_CLOUD: 'true'
    restart: unless-stopped
  api:
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
volumes:
  desk-models:
