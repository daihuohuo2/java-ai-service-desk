name: java-ai-service-desk
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: desk
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run scripts/init-env.ps1 or set DATABASE_PASSWORD}
    volumes:
      - desk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U desk -d desk"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build: ./backend
    image: java-ai-service-desk-api:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/desk
      DATABASE_USER: desk
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_DEMO: ${APP_DEMO:-true}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DemoAdmin!2026}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-DemoCustomer!2026}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-DemoAgent!2026}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:19082,http://localhost:19082}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:28434}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
      AI_ENABLED: ${AI_ENABLED:-true}
      MODEL_KEEP_ALIVE: ${MODEL_KEEP_ALIVE:-5m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  web:
    build: ./frontend
    image: java-ai-service-desk-web:1.0.0
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-19082}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  desk-data:
