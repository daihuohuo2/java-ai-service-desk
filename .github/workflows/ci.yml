name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack:
    name: Java, databases, middleware and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: desk_tests
          POSTGRES_USER: desk_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U desk_test -d desk_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-root
          MYSQL_DATABASE: desk_tests
          MYSQL_USER: desk_test
          MYSQL_PASSWORD: test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: desk_test
          RABBITMQ_DEFAULT_PASS: test-only-password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: H2 tests and executable JAR
        run: ./backend/mvnw -B -ntp -f backend/pom.xml verify
      - name: Java formatting
        shell: pwsh
        run: ./scripts/format-java.ps1 -Check
      - name: PostgreSQL plus real Redis and RabbitMQ
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/desk_tests
          TEST_DATABASE_USER: desk_test
          TEST_DATABASE_PASSWORD: test-only-password
          TEST_REDIS_PORT: '6379'
          TEST_RABBITMQ_PORT: '5672'
          MIDDLEWARE_TESTS: 'true'
        run: ./backend/mvnw -B -ntp -f backend/pom.xml test
      - name: MySQL migrations and business tests
        env:
          SPRING_PROFILES_ACTIVE: mysql
          TEST_DATABASE_URL: jdbc:mysql://localhost:3306/desk_tests?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
          TEST_DATABASE_USER: desk_test
          TEST_DATABASE_PASSWORD: test-only-password
        run: ./backend/mvnw -B -ntp -f backend/pom.xml test
      - name: Java learning labs
        run: |
          java learning/FullstackBasics.java
          java learning/ConcurrencyLab.java
          java learning/IdempotencyVersionLab.java
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Chromium browser tests
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Validate deployment configurations
        env:
          DATABASE_PASSWORD: ci-compose-validation-only
        run: |
          docker compose -f compose.yaml -f compose.middleware.yaml -f compose.observability.yaml config --quiet
          docker compose -f compose.mysql.yaml -f compose.middleware.yaml config --quiet
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
