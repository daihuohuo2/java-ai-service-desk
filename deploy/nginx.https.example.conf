# Replace the domain and certificate paths on your own Linux reverse proxy.
# This example forwards to the loopback-bound Compose web port.
server {
    listen 80;
    server_name desk.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name desk.example.com;
    ssl_certificate /etc/letsencrypt/live/desk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.example.com/privkey.pem;
    client_max_body_size 300k;
    location / {
        proxy_pass http://127.0.0.1:19082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
