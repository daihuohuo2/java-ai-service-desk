services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-observability}
      MANAGEMENT_BIND_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/actuator/health || exit 1"]
  web:
    volumes:
      - ./deploy/nginx.observability.conf:/etc/nginx/conf.d/default.conf:ro
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - desk-metrics:/prometheus
    ports: ["127.0.0.1:19090:9090"]
    restart: unless-stopped
volumes:
  desk-metrics:
